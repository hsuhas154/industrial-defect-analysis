# Human decisions for image pairs the near-duplicate detector cannot settle on
# its own. Entries override the detector. Use file names, not full paths.
#
#   same:      pairs to keep in one split (detector missed or was unsure)
#   distinct:  pairs that are genuinely different images (detector was unsure)
#
# The dataset report lists every pair awaiting review together with an
# aligned side-by-side figure (experiments/figures/duplicates/review_pairs.png).
