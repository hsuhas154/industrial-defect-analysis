  - [In_59.bmp, In_96.bmp]
  - [In_109.bmp, In_156.bmp]
  - [In_111.bmp, In_156.bmp]
  - [In_112.bmp, In_156.bmp]
  - [In_113.bmp, In_156.bmp]
  - [In_111.bmp, In_167.bmp]
  - [In_112.bmp, In_167.bmp]
  - [In_169.bmp, In_194.bmp]
distinct:
  - [Sc_103.bmp, Sc_288.bmp]
  - [Sc_50.bmp, Sc_53.bmp]
  - [Sc_275.bmp, Sc_37.bmp]
